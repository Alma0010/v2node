name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.2.3; leave blank to build only'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
      - "script/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
      - "script/**"
  release:
    types: [published]

permissions:
  contents: read

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve and validate release version
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 script/release.py prepare

  test:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      V2NODE_REQUIRE_MIHOMO_TEST: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download checksum-pinned mihomo regression client
        run: |
          mihomo_test_binary="$RUNNER_TEMP/mihomo-v1.19.31"
          python3 tests/fetch_mihomo.py --output "$mihomo_test_binary"
          echo "V2NODE_MIHOMO_TEST_BINARY=$mihomo_test_binary" >> "$GITHUB_ENV"
      - name: Test node and AnyTLS authentication
        run: go test ./... github.com/xtls/xray-core/proxy/anytls
      - name: Check Go code
        run: go vet ./...
      - name: Test installation and download routes
        run: |
          bash -n script/install.sh
          bash -n script/v2node.sh
          python3 -m unittest discover -s tests -v
      - name: Test Alpine 3.21 service updates with real OpenRC
        run: bash tests/test_alpine_openrc.sh

  build:
    needs: [prepare, test]
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
        include:
          # BEIGIN MacOS ARM64
          - goos: darwin
            goarch: arm64
          # END MacOS ARM64
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Other architectures
          # BEGIN riscv64 & ARM64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          # END riscv64 & ARM64
          # BEGIN MIPS
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          # END MIPS
          # BEGIN PPC
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          # END PPC
          # BEGIN FreeBSD ARM
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          # END FreeBSD ARM
          # BEGIN S390X
          - goos: linux
            goarch: s390x
          # END S390X
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v5
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Get project dependencies
        run: |
          go mod download
      - name: Build v2node
        run: |
          echo "version: $version"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 go build -v -o build_assets/v2node -trimpath -ldflags "-X 'github.com/wyx2685/v2node/cmd.version=$version' -s -w -buildid="

      - name: Build Mips softfloat v2node
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        run: |
          echo "version: $version"
          GOEXPERIMENT=jsonv2 GOMIPS=softfloat go build -v -o build_assets/v2node_softfloat -trimpath -ldflags "-X 'github.com/wyx2685/v2node/cmd.version=$version' -s -w -buildid="
      - name: Rename Windows v2node
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv v2node v2node.exe
      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          cp ${GITHUB_WORKSPACE}/script/config.json ./build_assets/config.json
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/${i}.dat"
            FILE_NAME="${i}.dat"
            echo -e "Downloading ${DOWNLOAD_URL}..."
            curl -fL --retry 3 --connect-timeout 10 --max-time 120 "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
          done
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../v2node-$ASSET_NAME.zip .
          popd || exit 1
          FILE=./v2node-$ASSET_NAME.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done
      - name: Change the name
        run: |
          mv build_assets v2node-$ASSET_NAME
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: v2node-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./v2node-${{ steps.get_filename.outputs.ASSET_NAME }}/*
      - name: Upload release archives
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: ./v2node-${{ steps.get_filename.outputs.ASSET_NAME }}.zip*

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    concurrency:
      group: v2node-release-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish completed release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 script/release.py publish
